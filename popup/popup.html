<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Подписи заполняет popup.js через chrome.i18n: держать их в разметке
         значило бы прибить интерфейс к одному языку. -->
    <h1 id="title"></h1>

    <label class="row" for="enabled">
      <span id="enabled-label"></span>
      <input type="checkbox" id="enabled" class="switch" />
    </label>

    <p class="note" id="note"></p>

    <!-- Отдельной строкой ПОСЛЕ примечания: оно относится только к первому
         тумблеру. div, а не label — внутри уже есть свои подписи у кнопок.

         Кнопки собраны из радиокнопок по той же причине, что и тумблер выше:
         взаимное исключение, выбор стрелками и объявление скринридером
         достаются от браузера. -->
    <div class="row row-static block-start">
      <span id="theme-label"></span>
    </div>

    <!-- Кнопки отдельной строкой под подписью, а не рядом с ней: "Как на
         устройстве" рядом с двумя другими в окно шириной 250px не помещается.
         Порядок как у YouTube в меню аккаунта — сначала следование системе,
         затем явный выбор. -->
    <div class="segmented">
      <input
        type="radio"
        name="theme"
        id="theme-device"
        value="device"
        class="seg-input"
      />
      <label class="seg" for="theme-device" id="theme-device-label"></label>
      <input
        type="radio"
        name="theme"
        id="theme-light"
        value="light"
        class="seg-input"
      />
      <label class="seg" for="theme-light" id="theme-light-label"></label>
      <input
        type="radio"
        name="theme"
        id="theme-dark"
        value="dark"
        class="seg-input"
      />
      <label class="seg" for="theme-dark" id="theme-dark-label"></label>
    </div>

    <!-- Тумблером, а не кнопками: состояний два, и строка читается так же,
         как "Расширение включено" выше. Перезагрузки не требует — скрытие
         держит CSS, см. секцию SHORTS в styles.css. -->
    <label class="row block-start" for="shorts">
      <span id="shorts-label"></span>
      <input type="checkbox" id="shorts" class="switch" />
    </label>

    <section class="timer">
      <h2 id="timer-title" class="timer-title"></h2>

      <!-- role="timer" без aria-live: живая область озвучивала бы каждую
           секунду. Скринридер прочитает значение, когда до него дойдут. -->
      <p id="timer-clock" class="timer-clock" role="timer">--:--</p>

      <div class="timer-actions">
        <button id="timer-toggle" type="button" class="btn btn-accent"></button>
        <button id="timer-reset" type="button" class="btn"></button>
      </div>

      <!-- label с for, а не обёртка вокруг всей строки: строку раньше
           замыкал <label>, и клик по будущим кнопкам степпера внутри нёс бы
           ещё и родное поведение label — перевод фокуса на input поверх
           собственного обработчика кнопки. -->
      <div class="timer-length">
        <label id="length-label" for="length-min"></label>
        <div class="stepper">
          <!-- aria-label ставит popup.js через chrome.i18n: у кнопки нет
               текста, только иконка, и без него скринридер объявил бы её
               безымянной. -->
          <button id="length-minus" type="button" class="step-btn">
            <svg class="step-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 11h14v2H5z" />
            </svg>
          </button>
          <input id="length-min" type="number" min="1" max="180" step="1" />
          <button id="length-plus" type="button" class="step-btn">
            <svg class="step-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" />
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Обычные ссылки, а не виджет Ko-fi: тот подгружает скрипт со своего
         домена, а MV3 запрещает внешний код, и CSP окна его не пропустит.

         Обе ссылки видны сразу, без выбора по языку: сервисы принимают карты
         разных стран, и какой подойдёт — человек знает лучше нас.

         Значки нарисованы здесь, а не картинками из icons/: inline-SVG
         наследует цвет ссылки через currentColor и потому следует теме окна.
         aria-hidden — название сервиса написано текстом рядом.

         rel="noopener noreferrer" при target="_blank" обязателен: без него
         открытая вкладка получает ссылку на окно-открыватель. -->
    <p class="support">
      <span id="support-label"></span>
      <span class="support-links">
        <a
          href="https://boosty.to/batton_rooge/donate"
          target="_blank"
          rel="noopener noreferrer"
          ><svg class="support-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.661 14.337 6.801 0h6.362L11.88 4.444l-.038.077-3.378 11.733h3.15c-1.321 3.289-2.35 5.867-3.086 7.733-5.816-.063-7.442-4.228-6.02-9.155M8.554 24l7.67-11.035h-3.25l2.83-7.073c4.852.508 7.137 4.33 5.791 8.952C20.16 19.81 14.344 24 8.68 24h-.127z" /></svg
          >Boosty</a
        >
        <a
          href="https://ko-fi.com/batton_rouge"
          target="_blank"
          rel="noopener noreferrer"
          ><svg class="support-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11.351 2.715c-2.7 0-4.986.025-6.83.26C2.078 3.285 0 5.154 0 8.61c0 3.506.182 6.13 1.585 8.493 1.584 2.701 4.233 4.182 7.662 4.182h.83c4.209 0 6.494-2.234 7.637-4a9.5 9.5 0 0 0 1.091-2.338C21.792 14.688 24 12.22 24 9.208v-.415c0-3.247-2.13-5.507-5.792-5.87-1.558-.156-2.65-.208-6.857-.208m0 1.947c4.208 0 5.09.052 6.571.182 2.624.311 4.13 1.584 4.13 4v.39c0 2.156-1.792 3.844-3.87 3.844h-.935l-.156.649c-.208 1.013-.597 1.818-1.039 2.546-.909 1.428-2.545 3.064-5.922 3.064h-.805c-2.571 0-4.831-.883-6.078-3.195-1.09-2-1.298-4.155-1.298-7.506 0-2.181.857-3.402 3.012-3.714 1.533-.233 3.559-.26 6.39-.26m6.547 2.287c-.416 0-.65.234-.65.546v2.935c0 .311.234.545.65.545 1.324 0 2.051-.754 2.051-2s-.727-2.026-2.052-2.026m-10.39.182c-1.818 0-3.013 1.48-3.013 3.142 0 1.533.858 2.857 1.949 3.897.727.701 1.87 1.429 2.649 1.896a1.47 1.47 0 0 0 1.507 0c.78-.467 1.922-1.195 2.623-1.896 1.117-1.039 1.974-2.364 1.974-3.897 0-1.662-1.247-3.142-3.039-3.142-1.065 0-1.792.545-2.338 1.298-.493-.753-1.246-1.298-2.312-1.298" /></svg
          >Ko-fi</a
        >
      </span>
    </p>

    <script src="popup.js"></script>
  </body>
</html>
